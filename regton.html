<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regton - Auravale Cosmetics</title>
  <link rel="stylesheet" href="style.css?v=80">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">Auravale Cosmetics</a>
    <a href="index.html" class="cart-btn-nav" style="text-decoration: none;">🏠 الرئيسية</a>
  </nav>

  <main style="max-width: 1000px; margin: 30px auto; padding: 0 15px; box-sizing: border-box;">
    <div style="background: #fff; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-wrap: wrap; gap: 30px; align-items: center;">
      
      <div style="flex: 1; min-width: 280px;">
        <img src="regton.jpg" alt="Regton" style="width: 100%; border-radius: 10px; object-fit: cover;">
      </div>

      <div style="flex: 1; min-width: 280px;">
        <a href="index.html" style="color: #b59410; text-decoration: none; font-size: 14px; font-weight: bold; display: inline-block; margin-bottom: 10px;">← العودة للمتجر</a>
        
        <h2 style="margin: 0 0 10px 0; color: #333;">Regton</h2>
        <p style="color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 15px;">
          مستحضر متخصص للعناية المتكاملة وتجديد حيوية البشرة وحمايتها.
        </p>

        <div style="margin-bottom: 20px;">
          <span style="font-size: 22px; font-weight: bold; color: #b59410;">135 ج.م</span>
          <span style="text-decoration: line-through; color: #aaa; margin-right: 10px; font-size: 16px;">175 ج.م</span>
        </div>

        <div style="background: #fdfbf7; border: 1px solid #f0e6d2; padding: 20px; border-radius: 10px;">
          <h4 style="margin-top: 0; color: #b59410; margin-bottom: 15px; text-align: center;">أدخل بياناتك لإتمام الطلب:</h4>
          
          <form onsubmit="sendProductOrder(event, 'Regton', 135)">
            <div style="margin-bottom: 10px;">
              <label style="display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px;">الاسم بالكامل:</label>
              <input type="text" id="p-name" required placeholder="أدخل اسمك الكريم" style="width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 10px;">
              <label style="display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px;">رقم الهاتف:</label>
              <input type="tel" id="p-phone" required placeholder="رقم الموبايل للتواصل" style="width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
              <label style="display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px;">العنوان بالتفصيل:</label>
              <textarea id="p-address" required rows="2" placeholder="المحافظة - المدينة - الشارع" style="width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; resize: none;"></textarea>
            </div>

            <button type="submit" style="width: 100%; padding: 12px; background: #b59410; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-bottom: 8px; transition: 0.3s;" onmouseover="this.style.background='#967a0d'" onmouseout="this.style.background='#b59410'">
              تأكيد الطلب 🚀
            </button>

            <button type="button" onclick="chatWhatsApp('Regton')" style="width: 100%; padding: 10px; background: #25d366; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer;">
              تحدث معنا عبر الواتساب 💬
            </button>
          </form>
        </div>

      </div>
    </div>
  </main>

  <script>
    const PHONE_NUMBER = "201000000000";

    function sendProductOrder(event, productName, price) {
      event.preventDefault();
      const name = document.getElementById('p-name').value;
      const phone = document.getElementById('p-phone').value;
      const address = document.getElementById('p-address').value;

      let msg = `🛒 *طلب جديد عبر الموقع*\n`;
      msg += `-------------------------\n`;
      msg += `📦 *المنتج:* ${productName}\n`;
      msg += `💰 *السعر:* ${price} ج.م\n`;
      msg += `-------------------------\n`;
      msg += `👤 *الاسم:* ${name}\n`;
      msg += `📞 *الهاتف:* ${phone}\n`;
      msg += `🏠 *العنوان:* ${address}`;

      window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function chatWhatsApp(productName) {
      const msg = `مرحباً Auravale Cosmetics، أريد الاستفسار عن منتج: ${productName}`;
      window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
    }
  </script>
<!-- كود جافاسكربت لعرض مراجعات ريجتون فقط دون تغيير التصميم الأصلي -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const regtonReviews = [
      { name: "غادة إبراهيم", rating: "★★★★★", date: "منذ 3 أيام", text: "مكمل ممتاز جداً، فرق معايا في النشاط والتركيز اليومي وقلل الإرهاق تماماً.", verified: true },
      { name: "أمنية نبيل", rating: "★★★★★", date: "منذ أسبوع", text: "فرق معايا جداً في الحيوية خلال اليوم، منتج مميز والنتيجة ظهرت معايا بسرعة.", verified: true },
      { name: "فرح طارق", rating: "★★★★★", date: "منذ أسبوعين", text: "تركيبة ممتازة ومفيدة جداً، والتوصيل كان سريع والمنتج أصلـي.", verified: true }
    ];

    const reviewsContainer = document.querySelector(".product-reviews-list") || document.getElementById("productReviewsList");
    
    if (reviewsContainer) {
      reviewsContainer.innerHTML = regtonReviews.map(rev => `
        <div class="product-review-card">
          <div class="review-card-top">
            <div class="reviewer-name">
              ${rev.name}
              ${rev.verified ? '<span class="verified-badge">✓ مشتري مؤكد</span>' : ''}
            </div>
            <div class="review-stars">${rev.rating}</div>
          </div>
          <div class="review-comment">${rev.text}</div>
          <div class="review-date">${rev.date}</div>
        </div>
      `).join('');
    }
  });
</script>

</body>
</html>
